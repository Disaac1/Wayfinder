name: Build Custom UI-Only Export Template

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot git tag or branch to build'
        required: true
        default: '4.7-stable'
      enable_upx:
        description: 'Compress binary with UPX (reduces size further to ~8-12MB)'
        type: boolean
        required: false
        default: true

jobs:
  build-windows-template:
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: |
          python -m pip install --upgrade pip
          pip install scons

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Clone Godot Engine
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.godot_version }} https://github.com/godotengine/godot.git godot-src

      - name: Copy Build Profile
        run: |
          Copy-Item "client/profiles/ui_only.build" "godot-src/ui_only.build"

      - name: Compile Custom Release Export Template
        working-directory: godot-src
        run: |
          scons platform=windows target=template_release arch=x86_64 build_profile=ui_only.build disable_3d=yes optimize=size use_lto=yes deprecated=no vrs=no openxr=no -j2

      - name: Install UPX and Compress
        if: ${{ github.event.inputs.enable_upx == true || github.event.inputs.enable_upx == 'true' }}
        run: |
          choco install upx -y
          upx --best --lzma "godot-src/bin/godot.windows.template_release.x86_64.exe"

      - name: Rename Output Binary
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item "godot-src/bin/godot.windows.template_release.x86_64.exe" "dist/windows_release_x86_64.exe"

      - name: Upload Export Template Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-ui-only-export-template-windows
          path: dist/windows_release_x86_64.exe
